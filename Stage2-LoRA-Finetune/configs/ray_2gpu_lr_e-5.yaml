project:
  name: project_name
  seed: 42

paths:
  raw_data: data/raw/input.jsonl
  interim_dir: data/interim
  processed_dir: data/processed
  output_dir: outputs
  log_dir: logs

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  base_url: http://localhost:8000/v1
  api_key: dummy
  temperature: 0.2
  max_tokens: 1024

processing:
  max_samples: null
  batch_size: 16

validation:
  min_question_length: 5
  min_answer_length: 5
  require_final_answer: false

finetune:
  model_path: models/Qwen3-0.6B-Base
  dataset_path: data/sft/sft_boxed_small.json
  output_dir: outputs/qwen3-0.6b-lora
  timestamp_output_dir: true
  logging_dir: logs
  max_seq_length: 1024
  eval_split_ratio: 0.1
  use_wandb: true
  wandb_mode: online
  run_name: qwen3-0.6b-lora-sft-small-ray-dual-gpu
  dtype: auto
  bf16: false
  fp16: true
  gradient_checkpointing: false
  dataloader_num_workers: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.00001
  num_train_epochs: 10
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 5
  early_stop_metric: eval_loss  # options: eval_loss | boxed_accuracy
  early_stop_patience: 2
  lora_checkpoint_symlinks: true
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  wandb:
    project: stage2-qwen3-lora
    entity: ""
    name: qwen3-0.6b-lora-superparameter_search

evaluation:
  test_data_path: data/eval/valid_800.jsonl
  sample_size: 64
  batch_size: 4
  every_n_steps: 100
  seed: 2026
  max_new_tokens: 512
  temperature: 0.0
  do_sample: false
  enable_during_training: true
  async_backend: ray
  ray:
    address: null
    eval_device: cuda:1
    max_pending_jobs: 1
    progress_every_rows: null

hparam_search:
  method: tpe
  target_metric: boxed_accuracy
  trial_max_steps: 199
  disable_train_time_boxed_eval: true
  search_space:
    learning_rate:
      min: 1e-6
      max: 1e-3
      log: true
